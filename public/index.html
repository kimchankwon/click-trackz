<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <title>Cue Tracker</title>
    <style id="expo-reset">
      html,
      body {
        height: 100%;
      }
      body {
        overflow: hidden;
        display: flex;
        flex-direction: column;
        background: #ffffff;
      }
      #root {
        display: flex;
        flex: 1;
        min-height: 0;
      }
      #credits {
        flex: none;
        padding: 4px 16px calc(4px + env(safe-area-inset-bottom, 0px));
        font: 11px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        text-align: center;
        color: #60646c;
        background: #ffffff;
      }
      #credits a {
        color: inherit;
      }
      @media (prefers-color-scheme: dark) {
        body,
        #credits {
          background: #000000;
        }
        #credits {
          color: #b0b4ba;
        }
      }
    </style>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <footer id="credits">BPM data from <a href="https://getsongbpm.com">GetSongBPM</a></footer>
  </body>
</html>
