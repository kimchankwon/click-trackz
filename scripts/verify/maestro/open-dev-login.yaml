appId: com.kimchankwon.cuetracker
---
- runFlow: launch-signed-out.yaml
- openLink: clicktrackz://dev-login?secret=${DEV_SECRET}
- extendedWaitUntil:
    visible: "Open|Dev login"
    timeout: 30000
- runFlow:
    when:
      visible: "Open"
    commands:
      - tapOn: "Open"
- extendedWaitUntil:
    visible: "Dev login"
    timeout: 30000
