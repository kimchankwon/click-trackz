appId: com.kimchankwon.cuetracker
---
- runFlow: launch-signed-out.yaml
- tapOn:
    id: "about-get-started"
- tapOn: "About Click Trackz"
- extendedWaitUntil:
    visible: "Multiple devices, one beat"
    timeout: 15000
- scrollUntilVisible:
    element: "Every device starts on the same timing"
    direction: DOWN
    waitToSettleTimeoutMs: 500
    timeout: 30000
- swipe:
    start: "50%, 60%"
    end: "50%, 30%"
    duration: 3000
- waitForAnimationToEnd
- takeScreenshot: ${SHOT}
