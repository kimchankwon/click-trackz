appId: com.kimchankwon.cuetracker
---
- runFlow: sign-in.yaml
- tapOn: ".*${GROUP_NAME}.*"
- extendedWaitUntil:
    visible: "Pick a Song"
    timeout: 30000
- tapOn:
    id: "enable-sound"
    optional: true
- extendedWaitUntil:
    notVisible:
      id: "enable-sound"
    timeout: 15000
- waitForAnimationToEnd
- takeScreenshot: ${SHOT}
